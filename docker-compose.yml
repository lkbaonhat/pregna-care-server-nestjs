services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pregnacare-api
    restart: always
    develop:
      watch:
        - action: sync
          path: .
          target: /app
    ports:
      - '8080:8080'
    environment:
      MONGODB_URI: mongodb://root:example@pregnacare-dev:27017
    depends_on:
      - mongo
    env_file: .env.development
  mongo:
    image: mongo
    container_name: pregnacare-dev
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
    driver: local
